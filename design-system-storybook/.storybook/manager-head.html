<!-- Google Analytics 4 (GA4) Integration for Storybook Main Manager Application -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-11NW9JPLC5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const GA_MEASUREMENT_ID = 'G-11NW9JPLC5';
  gtag('config', GA_MEASUREMENT_ID, {
    send_page_view: true
  });

  // Track navigation inside Storybook manager UI (tabs, docs, stories)
  function trackManagerNavigation() {
    if (typeof window.gtag === 'function') {
      window.gtag('event', 'page_view', {
        page_title: document.title || 'UEDP Design System Storybook',
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.search + window.location.hash
      });
    }
  }

  window.addEventListener('popstate', trackManagerNavigation);
  window.addEventListener('hashchange', trackManagerNavigation);
</script>
