<!-- Google Analytics 4 (GA4) Integration for Storybook Preview & Component Interactions -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-11NW9JPLC5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const GA_MEASUREMENT_ID = 'G-11NW9JPLC5';
  gtag('config', GA_MEASUREMENT_ID, {
    send_page_view: true,
    cookie_flags: 'SameSite=None;Secure'
  });

  // Track Storybook story route changes via hashchange and popstate
  function trackStoryView() {
    if (typeof window.gtag === 'function') {
      const currentPath = window.location.pathname + window.location.search + window.location.hash;
      window.gtag('event', 'page_view', {
        page_title: document.title || 'Storybook Component',
        page_location: window.location.href,
        page_path: currentPath
      });
    }
  }

  window.addEventListener('hashchange', trackStoryView);
  window.addEventListener('popstate', trackStoryView);
</script>
